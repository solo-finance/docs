  /v1/graph/models:
    get:
      tags:
      - Graph
      summary: Describe every model in the data graph.
      description: "Describe the data graph: each model, its resource path, and its\
        \ fields.\n\nProducts and policies are both projections of this graph, so\
        \ this is the\nground truth either one is defined against. Call it to discover\
        \ which\nresources exist and which relationships can be expanded.\n\nReturns\n\
        ----\n`models` : `GraphModelsResponse`.\n    One entry per model the graph\
        \ serves.\n\nExamples\n-----\n```\nGET /v1/graph/models\n```"
      operationId: list_graph_models_v1_graph_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModelsResponse'
      security:
      - HTTPBearer: []
  /v1/graph/{resource}:
    get:
      tags:
      - Graph
      summary: Read a page of one model's objects.
      description: "Read a page of objects for one graph model.\n\nParameters\n----\n\
        `resource` : `str`.\n    Resource path segment, as reported by ``GET /v1/graph/models``.\n\
        \n`network_id` : `list[UUID]`.\n    Networks to read within. Repeat the parameter\
        \ to widen the scope;\n    omit it to use every network the caller can reach.\n\
        \n`expand` : `str`, optional.\n    Comma-separated relationship names to include\
        \ inline, every field.\n\n`fields` : `list[str]`.\n    Fields to read, comma-separated\
        \ or one per repeated parameter;\n    dotted paths reach through relationships.\
        \ Every scalar of the\n    resource when omitted.\n\n`limit` : `int`.\n  \
        \  Page size (1-100). Defaults to 25.\n\n`offset` : `int`.\n    Rows to skip\
        \ before the page.\n\nReturns\n----\n`page` : `GraphObjectsResponse`.\n  \
        \  The page of objects, with the limit and offset it was read at.\n\nExamples\n\
        -----\n```\nGET /v1/graph/consumer_identities?limit=10&expand=address_identities\n\
        GET /v1/graph/consumer_identities?fields=firstName,address_identities.city\n\
        GET /v1/graph/consumer_identities?fields=firstName&fields=address_identities.city\n\
        ```"
      operationId: list_graph_objects_v1_graph__resource__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
          description: Resource path from /graph/models, e.g. ``consumer-identities``
          title: Resource
        description: Resource path from /graph/models, e.g. ``consumer-identities``
      - name: network_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          description: Network scope; repeat to widen
          default: []
          title: Network Id
        description: Network scope; repeat to widen
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated relationships to expand
          title: Expand
        description: Comma-separated relationships to expand
      - name: fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Fields to read, comma-separated or one per repeated parameter.
            A dotted path reaches through relationships, e.g. ``firstName,addressIdentities.city``.
            Omit to read every scalar of the resource.
          default: []
          title: Fields
        description: Fields to read, comma-separated or one per repeated parameter.
          A dotted path reaches through relationships, e.g. ``firstName,addressIdentities.city``.
          Omit to read every scalar of the resource.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 25
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Rows to skip
          default: 0
          title: Offset
        description: Rows to skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphObjectsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/graph/{resource}/{object_id}:
    get:
      tags:
      - Graph
      summary: Read one graph object by id.
      description: "Read a single graph object by its global id.\n\nModels the graph\
        \ exposes only through a relationship have no collection\nendpoint, but are\
        \ still readable here and expandable from their parent.\n\nParameters\n----\n\
        `resource` : `str`.\n    Resource path segment, as reported by ``GET /v1/graph/models``.\n\
        \n`object_id` : `str`.\n    The object's global id.\n\n`network_id` : `list[UUID]`.\n\
        \    Networks to read within. Repeat the parameter to widen the scope.\n\n\
        `expand` : `str`, optional.\n    Comma-separated relationship names to include\
        \ inline, every field.\n\n`fields` : `list[str]`.\n    Fields to read, comma-separated\
        \ or one per repeated parameter;\n    dotted paths reach through relationships.\
        \ Every scalar of the\n    resource when omitted.\n\nReturns\n----\n`object`\
        \ : `GraphObjectResponse`.\n    The requested object.\n\nExamples\n-----\n\
        ```\nGET /v1/graph/address_identities/QWRkcmVzc09iamVjdDox?expand=addressVerificationEvents\n\
        GET /v1/graph/consumer_identities/Q29uc3VtZXJPYmplY3Q6MQ==?fields=firstName,address_identities.city\n\
        ```"
      operationId: get_graph_object_v1_graph__resource___object_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
          description: Resource path from /graph/models, e.g. ``address-identities``
          title: Resource
        description: Resource path from /graph/models, e.g. ``address-identities``
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          description: Global id of the object
          title: Object Id
        description: Global id of the object
      - name: network_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          description: Network scope; repeat to widen
          default: []
          title: Network Id
        description: Network scope; repeat to widen
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated relationships to expand
          title: Expand
        description: Comma-separated relationships to expand
      - name: fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Fields to read, comma-separated or one per repeated parameter.
            A dotted path reaches through relationships, e.g. ``firstName,addressIdentities.city``.
            Omit to read every scalar of the resource.
          default: []
          title: Fields
        description: Fields to read, comma-separated or one per repeated parameter.
          A dotted path reaches through relationships, e.g. ``firstName,addressIdentities.city``.
          Omit to read every scalar of the resource.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphObjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
