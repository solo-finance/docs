  /v1/file-upload/ingest:
    post:
      tags:
      - File Upload
      summary: Upload a CSV file for ingestion
      description: "Upload a CSV file and queue it for ingestion.\n\nThe file is accepted\
        \ synchronously and processed asynchronously. The\nresponse contains a record\
        \ describing the upload; its ``status`` begins\nas ``pending`` and transitions\
        \ to ``processing`` and then ``completed``\n(or ``failed``) as ingestion proceeds.\n\
        \nParameters\n----\n`file` : multipart file.\n    The CSV file to upload.\n\
        \n`slug` : `str`.\n    The data category for this upload (e.g. ``kyc_cert_policy``,\n\
        \    ``kyb_cert_policy``). Must be one of the categories supported for\n \
        \   your account.\n\nReturns\n----\n`file_upload` : `FileUpload`.\n    The\
        \ created upload record, including its ``id`` and current\n    ``status``.\n\
        \nRaises\n----\n`ValidationError`.\n    If the file name or ``slug`` is invalid.\n\
        \nExamples\n-----\n```bash\n>>> curl -X POST https://app.solo.one/file-upload/ingest\
        \ \\\n...   -H \"Authorization: Bearer $TOKEN\" \\\n...   -F \"file=@sample.csv\"\
        \ \\\n...   -F \"slug=kyc_cert_policy\"\n```"
      operationId: ingest_csv_v1_file_upload_ingest_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_csv_v1_file_upload_ingest_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
