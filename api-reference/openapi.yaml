        Carries whether a complete certificate could be issued for the exact query\n\
        selections (subject, policy, networks, furnishers), which product models\n\
        have a populated sub-product in the resolved result, and which\npolicy-required\
        \ data paths are missing. No resolved field values are\nreturned \u2014 the\
        \ soft check reveals issuability and match shape, never the\nunderlying data.\
        \ Soft checks always return an HTTP 200 body so clients can\nread ``matched_models``\
        \ / ``missing_data_paths`` when ``issuable`` is false."
