openapi: 3.1.0
info:
  title: SOLO Network API
  version: v1
servers:
- url: https://api.solo.one
  description: Production
- url: https://api.sandbox.solo.one
  description: Sandbox
paths:
  /v1/consent/business_identity:
    post:
      tags:
      - Business Identity
      summary: Create a business consent record (direct, server-to-server). Returns
        a consent_id used for all subsequent queries.
      description: Create a business consent record (direct, server-to-server). Returns
        a consent_id used for all subsequent queries.
      operationId: consent_business_identity_create_v1_consent_business_identity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentBusinessIdentityCreateInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentBusinessIdentityCreateOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/consent/consumer_identity:
    post:
      tags:
      - Consumer Identity
      summary: Create a consumer consent record (direct, server-to-server). Returns
        a consent_id used for all subsequent queries.
      description: Create a consumer consent record (direct, server-to-server). Returns
        a consent_id used for all subsequent queries.
      operationId: consent_consumer_identity_create_v1_consent_consumer_identity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentConsumerIdentityCreateInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentConsumerIdentityCreateOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/consent/consumer_identity/{consent_id}:
    get:
      tags:
      - Consumer Identity
      summary: Read a consumer consent record by consent_id.
      description: Read a consumer consent record by consent_id.
      operationId: consent_consumer_identity_read_v1_consent_consumer_identity__consent_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          title: Consent Id
      - name: network_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Network scope for the consent lookup
          title: Network Id
        description: Network scope for the consent lookup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentConsumerIdentityCreateOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Consumer Identity
      summary: Update a consumer consent record's scope, expiry, or consented fields.
        Identity fields are immutable.
      description: Update a consumer consent record's scope, expiry, or consented
        fields. Identity fields are immutable.
      operationId: consent_consumer_identity_update_v1_consent_consumer_identity__consent_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          title: Consent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentConsumerIdentityUpdateInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentConsumerIdentityCreateOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/entities/consumer_identity/search:
    get:
      tags:
      - Entities
      summary: Search consumer core identities by name, email, SSN, or date of birth.
      description: "Search consumer core identities using partial or exact field matches.\n\
        \nParameters\n----\n`network_id` : `UUID`.\n    Network scope for the search.\n\
        \n`first_name` : `str`, optional.\n    Case-insensitive partial match on first\
        \ name.\n\n`last_name` : `str`, optional.\n    Case-insensitive partial match\
        \ on last name.\n\n`personal_email` : `str`, optional.\n    Case-insensitive\
        \ partial match on email.\n\n`social_security_number` : `str`, optional.\n\
        \    Exact match on SSN.\n\n`date_of_birth` : `str`, optional.\n    Exact\
        \ match on date of birth (``YYYY-MM-DD``).\n\n`limit` : `int`.\n    Maximum\
        \ number of results (1-100). Defaults to 20.\n\nReturns\n----\n`results` :\
        \ `list[ConsumerIdentitySearchResult]`.\n    Matching consumer core identities.\n\
        \nExamples\n-----\n```\nGET /entities/consumer_identity/search?network_id=...&first_name=John&last_name=Doe&limit=10\n\
        ```"
      operationId: search_consumer_identities_v1_entities_consumer_identity_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: network_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Network scope for the search
          title: Network Id
        description: Network scope for the search
      - name: first_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on first name
          title: First Name
        description: Partial match on first name
      - name: last_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on last name
          title: Last Name
        description: Partial match on last name
      - name: personal_email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on email
          title: Personal Email
        description: Partial match on email
      - name: social_security_number
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact match on SSN
          title: Social Security Number
        description: Exact match on SSN
      - name: date_of_birth
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact match on date of birth (YYYY-MM-DD)
          title: Date Of Birth
        description: Exact match on date of birth (YYYY-MM-DD)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max results
          default: 20
          title: Limit
        description: Max results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsumerIdentitySearchResult'
                title: Response Search Consumer Identities V1 Entities Consumer Identity
                  Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/entities/business_identity/search:
    get:
      tags:
      - Entities
      summary: Search business core identities by name, EIN, or email.
      description: "Search business core identities using partial or exact field matches.\n\
        \nParameters\n----\n`network_id` : `UUID`.\n    Network scope for the search.\n\
        \n`business_legal_name` : `str`, optional.\n    Case-insensitive partial match\
        \ on legal name.\n\n`business_dba_name` : `str`, optional.\n    Case-insensitive\
        \ partial match on DBA name.\n\n`business_email` : `str`, optional.\n    Case-insensitive\
        \ partial match on email.\n\n`federal_ein` : `str`, optional.\n    Exact match\
        \ on federal EIN.\n\n`limit` : `int`.\n    Maximum number of results (1-100).\
        \ Defaults to 20.\n\nReturns\n----\n`results` : `list[BusinessIdentitySearchResult]`.\n\
        \    Matching business core identities.\n\nExamples\n-----\n```\nGET /entities/business_identity/search?network_id=...&business_legal_name=Acme&limit=10\n\
        ```"
      operationId: search_business_identities_v1_entities_business_identity_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: network_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Network scope for the search
          title: Network Id
        description: Network scope for the search
      - name: business_legal_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on legal name
          title: Business Legal Name
        description: Partial match on legal name
      - name: business_dba_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on DBA name
          title: Business Dba Name
        description: Partial match on DBA name
      - name: business_email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match on email
          title: Business Email
        description: Partial match on email
      - name: federal_ein
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact match on federal EIN
          title: Federal Ein
        description: Exact match on federal EIN
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max results
          default: 20
          title: Limit
        description: Max results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessIdentitySearchResult'
                title: Response Search Business Identities V1 Entities Business Identity
                  Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/institution-attestation-event:
    post:
      tags:
      - Institution Attestation Event
      summary: Create or renew an institution attestation for a product.
      description: "Create a new institution-level attestation scoped to the caller's\
        \ entity and product.\n\nThe attestation is valid for 12 months from the time\
        \ it is created.\nCreating a new attestation does not revoke prior ones; the\
        \ most\nrecently created active attestation for a given product is treated\n\
        as the current one.\n\nParameters\n----------\n`body` : `InstitutionAttestationEventCreateRequest`.\n\
        \    Attestation payload.\n\nReturns\n-------\n`response` : `InstitutionAttestationEventResponse`.\n\
        \    The newly created attestation record."
      operationId: create_institution_attestation_event_v1_institution_attestation_event_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionAttestationEventCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionAttestationEventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/networks/policies/querying:
    post:
      tags:
      - Querying Policies
      summary: Create a network-wide querying policy.
      description: "Create a new network-wide querying policy.\n\nPer-model and per-field\
        \ selections for the policy \u2014 which may span any\nproduct's models \u2014\
        \ are authored separately via\n``PUT /networks/policies/querying/{policy_id}/configuration``."
      operationId: create_policy_v1_networks_policies_querying_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePolicyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/networks/policies/querying/{policy_id}/configuration:
    put:
      tags:
      - Querying Policies
      summary: Save per-field selections onto an existing querying policy.
      description: 'Persist per-field selections onto an existing querying policy.


        Replaces the policy''s per-model and per-field selections with the

        submitted set. The policy is left in ``published`` status.'
      operationId: save_policy_configuration_v1_networks_policies_querying__policy_id__configuration_put
      security:
      - HTTPBearer: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePolicyConfigurationInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePolicyConfigurationResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/networks/policies/furnishing:
    get:
      tags:
      - Furnishing Policies
      summary: List furnishing policies in a network.
      description: "List furnishing policies visible within a network scope.\n\nResults\
        \ are paginated with ``limit`` (1-100, default 20) and\n``offset`` (>=0, default\
        \ 0).\n\nParameters\n----\n`network_id` : `UUID`.\n    Network scope for the\
        \ listing.\n\n`limit` : `int`.\n    Maximum number of results. Defaults to\
        \ 20.\n\n`offset` : `int`.\n    Number of results to skip. Defaults to 0.\n\
        \nReturns\n----\n`results` : `list[MappingResult]`.\n    Page of matching\
        \ furnishing policies.\n\nExamples\n-----\n```\nGET /networks/policies/furnishing?network_id=...&limit=10\n\
        ```"
      operationId: list_mappings_v1_networks_policies_furnishing_get
      security:
      - HTTPBearer: []
      parameters:
      - name: network_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Network scope for the listing.
          title: Network Id
        description: Network scope for the listing.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of results.
          default: 20
          title: Limit
        description: Maximum number of results.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of results to skip.
          default: 0
          title: Offset
        description: Number of results to skip.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MappingResult'
                title: Response List Mappings V1 Networks Policies Furnishing Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/networks/policies/furnishing/{policy_id}:
    get:
      tags:
      - Furnishing Policies
      summary: Get a furnishing policy by id.
      description: "Fetch a single furnishing policy by id, scoped to a network.\n\
        \nParameters\n----\n`policy_id` : `UUID`.\n    Identifier of the furnishing\
        \ policy to fetch.\n\n`network_id` : `UUID`.\n    Network scope for the lookup.\n\
        \nReturns\n----\n`result` : `MappingResult`.\n    The matching furnishing\
        \ policy.\n\nRaises\n----\n`NotFoundError`.\n    If no furnishing policy with\
        \ the given id is visible within the\n    given network scope.\n\nExamples\n\
        -----\n```\nGET /networks/policies/furnishing/{policy_id}?network_id=...\n\
        ```"
      operationId: get_mapping_v1_networks_policies_furnishing__policy_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Policy Id
      - name: network_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Network scope for the lookup.
          title: Network Id
        description: Network scope for the lookup.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
